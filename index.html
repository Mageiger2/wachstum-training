<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sMArTHEMATIK - Startseite</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        .page-transition { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes flyInStayFade {
            0% { transform: scale(0.2) translateY(50vh); opacity: 0; }
            15% { transform: scale(1.1) translateY(0); opacity: 1; }
            25% { transform: scale(1) translateY(0); opacity: 1; }
            75% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-30vh); opacity: 0; }
        }
        .animate-fly-logo { animation: flyInStayFade 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        body { background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .font-math { font-family: 'Times New Roman', Times, serif; }
    </style>
</head>
<body class="text-slate-800 font-sans antialiased flex flex-col min-h-screen">
    <div id="root" class="flex flex-col min-h-screen"></div>

    <script type="text/babel" data-presets="typescript,react">
        const { useState, useEffect } = React;

        // ==========================================
        // 1. ICONS
        // ==========================================
        const IconBase = ({ path, className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>;
        const Calculator = ({ className }) => <IconBase className={className} path={<><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></>} />;
        const CalculatorOff = ({ className }) => <IconBase className={className} path={<><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/><line x1="2" y1="2" x2="22" y2="22"/></>} />;
        const CheckCircle = ({ className }) => <IconBase className={className} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />;
        const XCircle = ({ className }) => <IconBase className={className} path={<><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></>} />;
        const RefreshCw = ({ className }) => <IconBase className={className} path={<><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></>} />;
        const BookOpen = ({ className }) => <IconBase className={className} path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />;
        const TrendingUp = ({ className }) => <IconBase className={className} path={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>} />;
        const TrendingDown = ({ className }) => <IconBase className={className} path={<><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></>} />;
        const ArrowRight = ({ className }) => <IconBase className={className} path={<><line x1="5" x2="19" y1="12" y2="12"/><polyline points="12 5 19 12 12 19"/></>} />;
        const ChevronRight = ({ className }) => <IconBase className={className} path={<><polyline points="9 18 15 12 9 6"/></>} />;
        const HomeIcon = ({ className }) => <IconBase className={className} path={<><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>} />;
        const MenuIcon = ({ className }) => <IconBase className={className} path={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} />;
        const Shield = ({ className }) => <IconBase className={className} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>} />;
        const FileText = ({ className }) => <IconBase className={className} path={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></>} />;
        const DeleteIcon = ({ className }) => <IconBase className={className} path={<><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></>} />;
        const HelpCircle = ({ className }) => <IconBase className={className} path={<><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />;
        const FastForward = ({ className }) => <IconBase className={className} path={<><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></>} />;
        const Target = ({ className }) => <IconBase className={className} path={<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>} />;
        const FractionIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="4" x2="20" y1="12" y2="12"/><path d="M11 7 L12 5 L12 9" /><path d="M10 15 L14 19 M14 15 L10 19" />
            </svg>
        );

        // ==========================================
        // 2. SHARED APP SHELL (Layout, Navbar, Footer)
        // ==========================================
        const AppShell = ({ activePage, children }) => {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [showImpressum, setShowImpressum] = useState(false);
            const [showDatenschutz, setShowDatenschutz] = useState(false);

            const NavLink = ({ href, id, label, icon: Icon }) => (
                <a href={href} className={`flex items-center gap-2 px-3 py-2 rounded-lg font-medium transition-colors ${activePage === id ? 'text-indigo-600 bg-indigo-50' : 'text-slate-600 hover:text-indigo-600 hover:bg-slate-50'}`}>
                    {Icon && <Icon className="w-4 h-4" />}<span className="whitespace-nowrap">{label}</span>
                </a>
            );

            return (
                <div className="flex flex-col min-h-screen">
                    <header className="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-200">
                        <div className="max-w-[1200px] mx-auto px-2 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-1 sm:gap-4">
                            <a href="index.html" className="flex items-center hover:opacity-80 transition-opacity shrink-0">
                                <img src="Logo-sMArTH.png" alt="sMArTHEMATIK Logo" className="h-5 sm:h-8 md:h-10 w-auto object-contain" onError={(e)=>{e.target.style.display='none'}} />
                            </a>
                            <a href="https://ms-dachau-sued.de/" target="_blank" rel="noopener noreferrer" className="flex-grow flex justify-center items-center px-1 sm:px-2 hover:opacity-80 transition-opacity min-w-0">
                                <img src="LogoMSsued2.jpg" alt="Mittelschule Dachau-Süd Logo" className="h-4 sm:h-8 md:h-10 w-auto object-contain shadow-sm rounded-sm" onError={(e)=>{e.target.style.display='none'}} />
                            </a>
                            <div className="flex items-center gap-1 sm:gap-3 shrink-0">
                                <nav className="hidden lg:flex items-center gap-1 mr-2">
                                    <NavLink href="index.html" id="home" label="Startseite" icon={HomeIcon} />
                                    <NavLink href="wachstum.html" id="wachstum" label="Wachstum" icon={TrendingUp} />
                                    <NavLink href="halbwertszeit.html" id="zerfall" label="Halbwertszeit" icon={TrendingDown} />
                                    <NavLink href="bruchgleichungen.html" id="gleichungen" label="Bruchgleichungen" icon={FractionIcon} />
                                    <NavLink href="kopfrechnen.html" id="kopfrechnen" label="Kopfrechnen" icon={CalculatorOff} />
                                </nav>
                                <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="lg:hidden p-1 sm:p-2 text-slate-600 hover:bg-slate-50 rounded-lg">
                                    {mobileMenuOpen ? <XCircle className="w-6 h-6" /> : <MenuIcon className="w-6 h-6" />}
                                </button>
                                <img src="cropped-BdB_Logo-1.png" alt="Beratung digitale Bildung Logo" className="h-6 sm:h-10 md:h-12 w-auto object-contain" onError={(e)=>{e.target.style.display='none'}} />
                            </div>
                        </div>
                        {mobileMenuOpen && (
                            <div className="lg:hidden bg-white border-t border-slate-100 p-4 flex flex-col gap-2 shadow-lg absolute w-full z-50">
                                <NavLink href="index.html" id="home" label="Startseite" icon={HomeIcon} />
                                <NavLink href="wachstum.html" id="wachstum" label="Wachstum & Zerfall" icon={TrendingUp} />
                                <NavLink href="halbwertszeit.html" id="zerfall" label="Halbwertszeit" icon={TrendingDown} />
                                <NavLink href="bruchgleichungen.html" id="gleichungen" label="Bruchgleichungen" icon={FractionIcon} />
                                <NavLink href="kopfrechnen.html" id="kopfrechnen" label="Kopfrechnen" icon={CalculatorOff} />
                            </div>
                        )}
                    </header>
                    <main className="flex-grow">{children}</main>
                    <footer className="bg-slate-900 text-slate-400 py-10 mt-auto border-t-4 border-indigo-600">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col items-center text-center space-y-6">
                            <div>
                                <h4 className="text-white text-lg font-bold uppercase tracking-wider mb-4">Kontakt & Infos</h4>
                                <a href="mailto:martin.geiger@ms-dachau-sued.de" className="inline-block px-6 py-2 bg-slate-800 text-slate-200 font-semibold rounded-lg hover:bg-indigo-600 hover:text-white transition-colors shadow-sm text-sm">E-Mail senden</a>
                                <p className="text-xs text-slate-500 mt-6 max-w-2xl mx-auto">
                                    Hinweis: Für die Richtigkeit der generierten Aufgaben und Berechnungen kann keine Garantie übernommen werden.<br/><br/>
                                    Quelle der Prüfungsaufgaben im Bereich Bruchgleichungen: <a href="https://www.bycs.de/pruefungsarchiv" target="_blank" rel="noopener noreferrer" className="underline hover:text-slate-300 transition-colors">Prüfungsarchiv des Bayerischen Staatsministeriums für Unterricht und Kultus (bycs.de)</a>.
                                </p>
                            </div>
                            <div className="w-full border-t border-slate-800 pt-6 mt-2 flex flex-col justify-between items-center text-sm gap-4">
                                <div className="flex flex-col md:flex-row items-center w-full justify-between gap-4">
                                    <div>&copy; 2026 - <strong className="text-white">Martin Geiger</strong></div>
                                    <div className="flex items-center gap-4">
                                        <button onClick={() => setShowImpressum(true)} className="hover:text-white transition-colors">Impressum</button>
                                        <span className="text-slate-700">|</span>
                                        <button onClick={() => setShowDatenschutz(true)} className="hover:text-white transition-colors">Datenschutz</button>
                                    </div>
                                </div>
                                <div className="mt-4 flex items-center gap-2 opacity-50 hover:opacity-100 transition-opacity grayscale hover:grayscale-0">
                                    <img src="https://hits.sh/ms-dachau-sued.de/smarthematik.svg?label=Aufrufe&color=4f46e5" alt="Seitenaufrufe Zähler" className="h-5" />
                                </div>
                            </div>
                        </div>
                    </footer>

                    {/* Modals für Impressum & Datenschutz */}
                    {showImpressum && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-8 shadow-2xl relative animate-fade-in">
                                <button onClick={() => setShowImpressum(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800"><XCircle className="w-6 h-6"/></button>
                                <h2 className="text-2xl font-bold mb-4 flex items-center gap-2"><FileText className="w-6 h-6 text-indigo-600"/> Impressum</h2>
                                <div className="space-y-4 text-slate-700">
                                    <div><h3 className="font-bold">Angaben gemäß § 5 TMG</h3><p>Martin Geiger<br/>Beratung digitale Bildung<br/>Eduard-Ziegler-Str. 3<br/>85221 Dachau</p></div>
                                    <div><h3 className="font-bold">Kontakt</h3><p>Telefon: 08131/741799<br/>E-Mail: martin.geiger@ms-dachau-sued.de</p></div>
                                    <div><h3 className="font-bold">Redaktionell verantwortlich</h3><p>Martin Geiger<br/>Eduard-Ziegler-Str. 3<br/>85221 Dachau</p></div>
                                </div>
                            </div>
                        </div>
                    )}
                    {showDatenschutz && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-8 shadow-2xl relative max-h-[90vh] overflow-y-auto animate-fade-in">
                                <button onClick={() => setShowDatenschutz(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800"><XCircle className="w-6 h-6"/></button>
                                <h2 className="text-2xl font-bold mb-4 flex items-center gap-2"><Shield className="w-6 h-6 text-indigo-600"/> Datenschutz</h2>
                                <div className="space-y-4 text-slate-700">
                                    <div><h3 className="font-bold text-lg">1. Datenschutz auf einen Blick</h3><p>Die folgenden Hinweise geben einen einfachen Überblick darüber, was mit Ihren personenbezogenen Daten passiert, wenn Sie diese Website besuchen.</p></div>
                                    <div><h3 className="font-bold text-lg">2. Hosting</h3><p>Diese Website wird bei dem externen Dienstleister GitHub Inc. gehostet.</p></div>
                                    <div><h3 className="font-bold text-lg">3. Lokale Speicherung (Local Storage)</h3><p>Die Mathetrainer auf dieser Webseite nutzen Ihren Browser, um Ihren aktuellen Lernfortschritt (Streak-Zahl) temporär im "Local Storage" zu speichern. Dies dient ausschließlich Ihrer eigenen Motivation über mehrere Tage hinweg. Es werden dabei keine persönlichen Daten erfasst und die Daten verlassen Ihren Browser zu keinem Zeitpunkt.</p></div>
                                    <div><h3 className="font-bold text-lg">4. Anonymer Besucherzähler</h3><p>Ganz unten auf der Webseite befindet sich ein kleiner, rein visueller Seitenaufruf-Zähler des Open-Source Dienstes "hits.sh". Dieser zählt Aufrufe streng anonym und verzichtet komplett auf das Setzen von Cookies oder das Tracking von IP-Adressen.</p></div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // 3. STARTSEITE KOMPONENTE
        // ==========================================
        const HomePage = () => (
            <div className="page-transition">
                <section className="bg-gradient-to-b from-indigo-50 to-slate-50 py-16 sm:py-24 border-b border-slate-200">
                    <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center gap-8 md:gap-12">
                        <div className="shrink-0 relative flex justify-center">
                            <div className="absolute inset-0 bg-indigo-200 blur-2xl opacity-30 scale-125 rounded-full"></div>
                            <img src="Logo-sMArTH.png" alt="sMArTHEMATIK Logo" className="relative w-64 md:w-80 h-auto object-contain drop-shadow-sm" onError={(e)=>{e.target.style.display='none'}} />
                        </div>
                        <div className="text-center md:text-left space-y-4">
                            <div className="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-sm font-semibold rounded-full mb-2">sMArTHEMATIK Übungen</div>
                            <h2 className="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">
                                Herzlich willkommen auf dieser Übungsseite für die 10. Klasse Mittelschule in Bayern!
                            </h2>
                            <p className="text-lg text-slate-600 max-w-2xl leading-relaxed">Hier stehen dir verschiedene interaktive Mathetrainer und digitale Lerntools zum Üben zur Verfügung.</p>
                        </div>
                    </div>
                </section>

                <section className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
                    <div className="text-center mb-12"><h3 className="text-2xl font-bold text-slate-800">Verfügbare Mathetrainer</h3></div>
                    <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <a href="wachstum.html" className="block bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-xl transition-all hover:-translate-y-1 flex flex-col items-center text-center group">
                            <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform"><TrendingUp className="w-8 h-8" /></div>
                            <h4 className="text-xl font-bold text-slate-800 mb-3">Wachstum & Zerfall</h4>
                            <p className="text-slate-600 mb-8 flex-grow text-sm">Zinseszins, Bevölkerung und Wertverlust (q &gt; 0) berechnen.</p>
                            <span className="w-full inline-flex items-center justify-center px-4 py-2 border border-emerald-200 font-medium rounded-lg text-emerald-700 bg-emerald-50 group-hover:bg-emerald-600 group-hover:text-white shadow-sm transition-all">Zum Trainer</span>
                        </a>
                        <a href="halbwertszeit.html" className="block bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-xl transition-all hover:-translate-y-1 flex flex-col items-center text-center group">
                            <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform"><TrendingDown className="w-8 h-8" /></div>
                            <h4 className="text-xl font-bold text-slate-800 mb-3">Halbwertszeit</h4>
                            <p className="text-slate-600 mb-8 flex-grow text-sm">Radioaktivität und Medikamente abbauen (q = 0,5).</p>
                            <span className="w-full inline-flex items-center justify-center px-4 py-2 border border-rose-200 font-medium rounded-lg text-rose-700 bg-rose-50 group-hover:bg-rose-600 group-hover:text-white shadow-sm transition-all">Zum Trainer</span>
                        </a>
                        <a href="bruchgleichungen.html" className="block bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-xl transition-all hover:-translate-y-1 flex flex-col items-center text-center group">
                            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform"><FractionIcon className="w-8 h-8" /></div>
                            <h4 className="text-xl font-bold text-slate-800 mb-3">Bruchgleichungen</h4>
                            <p className="text-slate-600 mb-8 flex-grow text-sm">Training zur Lösung komplexer Bruchgleichungen mit pq-Formel.</p>
                            <span className="w-full inline-flex items-center justify-center px-4 py-2 border border-amber-200 font-medium rounded-lg text-amber-700 bg-amber-50 group-hover:bg-amber-600 group-hover:text-white shadow-sm transition-all">Zum Trainer</span>
                        </a>
                        <a href="kopfrechnen.html" className="block bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-xl transition-all hover:-translate-y-1 flex flex-col items-center text-center group">
                            <div className="w-16 h-16 bg-sky-100 text-sky-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform"><CalculatorOff className="w-8 h-8" /></div>
                            <h4 className="text-xl font-bold text-slate-800 mb-3">Kopfrechnen</h4>
                            <p className="text-slate-600 mb-8 flex-grow text-sm">Schnelles Denken: Verschiedene Aufgabentypen für den MSA im Kopf lösen.</p>
                            <span className="w-full inline-flex items-center justify-center px-4 py-2 border border-sky-200 font-medium rounded-lg text-sky-700 bg-sky-50 group-hover:bg-sky-500 group-hover:text-white shadow-sm transition-all">Zum Trainer</span>
                        </a>
                    </div>
                </section>
            </div>
        );

        const App = () => <AppShell activePage="home"><HomePage /></AppShell>;
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
